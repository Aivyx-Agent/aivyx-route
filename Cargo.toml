[workspace]

[package]
name = "aivyx-route"
description = "Task-aware model routing shared by Aivyx PA and aivyx-coder: capability matching, tiering, discovery"
version = "0.1.0"
edition = "2024"
license = "BUSL-1.1"
publish = false

[features]
default = []
discovery = ["dep:reqwest", "dep:serde_json", "dep:futures-util", "dep:tokio"]

[dependencies]
serde = { version = "1", features = ["derive"] }
url = "2"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"], optional = true }
serde_json = { version = "1", optional = true }
futures-util = { version = "0.3", default-features = false, features = ["std"], optional = true }
# Timers only; reqwest already runs on tokio.
tokio = { version = "1", default-features = false, features = ["time"], optional = true }

[dev-dependencies]
serde_json = "1"
toml = "0.9"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6.5"
